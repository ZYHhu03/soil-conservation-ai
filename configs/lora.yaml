model_name_or_path: Qwen/Qwen-7B-Chat
trust_remote_code: true
torch_dtype: bfloat16
load_in_4bit: false

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - c_attn
    - c_proj
    - w1
    - w2
  bias: none
  task_type: CAUSAL_LM

training:
  output_dir: outputs/soil-qwen-lora
  num_train_epochs: 3
  learning_rate: 0.0002
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 16
  gradient_checkpointing: true
  warmup_ratio: 0.05
  logging_steps: 5
  save_strategy: epoch
  evaluation_strategy: epoch
  save_total_limit: 2
  max_seq_length: 1024
  seed: 42

generation:
  max_new_tokens: 256
  temperature: 0.2
  top_p: 0.9
  do_sample: false
