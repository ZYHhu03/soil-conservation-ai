[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soil-conservation-ai"
version = "0.1.0"
description = "LoRA, RAG and ReAct Agent components for soil and water conservation QA"
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6.0",
]

[project.optional-dependencies]
train = [
  "torch>=2.1",
  "transformers>=4.37,<5",
  "peft>=0.10",
  "accelerate>=0.27",
  "datasets>=2.16",
  "bitsandbytes>=0.43; platform_system == 'Linux'",
]
rag = [
  "langchain-core>=0.2",
  "langchain-community>=0.2",
  "langchain-text-splitters>=0.2",
  "pymilvus>=2.4",
  "sentence-transformers>=2.6",
  "pypdf>=4.0",
]
agent = [
  "langgraph>=0.2",
  "mcp>=1.0",
]
test = [
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
